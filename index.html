<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daffa — Space Profile</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030206;
    color:#fff;
    font-family:"Courier New",monospace;
}

button{
    font:inherit;
}

/* =========================
   COMMON SPACE BACKGROUND
========================= */
.space{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(ellipse at center,
        rgba(76,25,93,.18),
        rgba(3,2,6,.96) 72%),
        #030206;
}

/* Purple curved grid */
.grid{
    position:absolute;
    width:125%;
    height:125%;
    left:-12.5%;
    top:-12.5%;
    opacity:.55;
    background-image:
        linear-gradient(rgba(150,55,180,.34) 1px,transparent 1px),
        linear-gradient(90deg,rgba(150,55,180,.34) 1px,transparent 1px);
    background-size:48px 48px;
    transform:
        perspective(500px)
        rotateX(12deg)
        scaleY(.92);
    border-radius:50%;
    -webkit-mask-image:
        radial-gradient(ellipse at center,black 35%,transparent 76%);
    mask-image:
        radial-gradient(ellipse at center,black 35%,transparent 76%);
    animation:gridMove 16s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(500px) rotateX(12deg)
        scaleY(.92) translateY(0);
    }
    to{
        transform:perspective(500px) rotateX(12deg)
        scaleY(.92) translateY(48px);
    }
}

/* Stars */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    opacity:.45;
    animation:blink 3.5s ease-in-out infinite;
}
.star:nth-child(1){left:13%;top:20%}
.star:nth-child(2){left:27%;top:67%;animation-delay:1s}
.star:nth-child(3){left:51%;top:17%;animation-delay:2s}
.star:nth-child(4){left:72%;top:31%;animation-delay:.5s}
.star:nth-child(5){left:87%;top:70%;animation-delay:1.7s}
.star:nth-child(6){left:62%;top:82%;animation-delay:2.5s}
.star:nth-child(7){left:9%;top:75%;animation-delay:.8s}

@keyframes blink{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.9;transform:scale(1.4)}
}

/* Shooting stars */
.shooting-star{
    position:absolute;
    width:90px;
    height:1px;
    background:linear-gradient(
        90deg,transparent,rgba(255,255,255,.9),transparent
    );
    opacity:0;
    transform:rotate(-28deg);
    animation:shooting 8s linear infinite;
}
.shoot-1{top:22%;left:78%;animation-delay:2s}
.shoot-2{top:63%;left:10%;animation-delay:5.5s}

@keyframes shooting{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(-28deg);
    }
    10%{opacity:.8}
    22%{
        opacity:0;
        transform:translate(-180px,100px) rotate(-28deg);
    }
    100%{opacity:0}
}

/* Pixel alien */
.alien{
    position:absolute;
    width:18px;
    height:14px;
    opacity:0;
    background:
        linear-gradient(
            90deg,
            transparent 0 3px,
            #a951d3 3px 6px,
            transparent 6px 12px,
            #a951d3 12px 15px,
            transparent 15px
        );
    box-shadow:
        3px 4px 0 #a951d3,
        6px 1px 0 #a951d3,
        9px 1px 0 #a951d3,
        12px 4px 0 #a951d3,
        6px 7px 0 #a951d3,
        9px 7px 0 #a951d3,
        3px 10px 0 #a951d3,
        12px 10px 0 #a951d3;
    animation:alienAppear 14s ease-in-out infinite;
}
.alien-1{left:17%;top:35%}
.alien-2{right:16%;bottom:24%;animation-delay:7s}

@keyframes alienAppear{
    0%,35%,100%{opacity:0}
    38%,48%{opacity:.65}
    52%{opacity:0}
}

/* =========================
   SCREEN 1 — PLANET
========================= */
.screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .8s ease,visibility .8s ease;
}

.screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.planet-screen{
    z-index:10;
    background:#030206;
}

.planet{
    width:min(330px,65vw);
    image-rendering:pixelated;
    opacity:.82;
    filter:
        brightness(.78)
        saturate(.82)
        drop-shadow(0 0 22px rgba(191,83,235,.18));
    cursor:pointer;
    animation:planetFloat 4s ease-in-out infinite;
}

@keyframes planetFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.click-me{
    position:absolute;
    margin-top:260px;
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    animation:softBlink 1.5s infinite;
}

@keyframes softBlink{
    0%,100%{opacity:.35}
    50%{opacity:.9}
}

/* =========================
   SCREEN 2 — LOADING
========================= */
.loading-screen{
    z-index:20;
    background:#030206;
    flex-direction:column;
    gap:14px;
}

.loading-text{
    font-size:13px;
    letter-spacing:3px;
    color:#eee;
}

.loading-bar{
    width:min(260px,65vw);
    height:6px;
    border:1px solid #777;
    padding:1px;
}

.loading-fill{
    height:100%;
    width:0%;
    background:#eee;
    animation:load 5s linear forwards;
}

@keyframes load{
    to{width:100%}
}

/* =========================
   SCREEN 3 — HERE WE GO
========================= */
.here-screen{
    z-index:30;
    background:#030206;
}

.here{
    font-family:"Arial Black","Courier New",monospace;
    font-size:clamp(30px,8vw,72px);
    letter-spacing:6px;
    font-weight:900;
    opacity:0;
    animation:hereIn 2s ease forwards;
}

@keyframes hereIn{
    0%{opacity:0;transform:scale(.96)}
    35%,75%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.02)}
}

/* =========================
   SCREEN 4 — DIALOGUE
========================= */
.dialogue-screen{
    z-index:40;
    background:
        radial-gradient(ellipse at center,
        rgba(45,10,58,.22),
        rgba(3,2,6,.4) 70%),
        transparent;
}

.intro{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(650px,82vw);
    display:flex;
    justify-content:center;
}

.dialogue{
    position:relative;
    width:100%;
    padding:24px 28px;
    background:rgba(30,29,36,.86);
    border:1px solid rgba(185,185,195,.48);
    color:#eee;
    box-shadow:
        0 0 0 1px rgba(0,0,0,.8),
        0 8px 30px rgba(0,0,0,.45);
    clip-path:polygon(
        0 7px,
        7px 7px,
        7px 0,
        calc(100% - 7px) 0,
        calc(100% - 7px) 7px,
        100% 7px,
        100% calc(100% - 7px),
        calc(100% - 7px) calc(100% - 7px),
        calc(100% - 7px) 100%,
        7px 100%,
        7px calc(100% - 7px),
        0 calc(100% - 7px)
    );
}

.dialogue::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    right:14px;
    bottom:12px;
    background:#888;
}

.text{
    min-height:70px;
    font-size:clamp(14px,3vw,20px);
    font-weight:600;
    line-height:1.7;
    letter-spacing:1px;
    text-shadow:0 1px 0 #000;
}

.cursor{
    display:inline-block;
    width:8px;
    height:18px;
    margin-left:3px;
    background:#eee;
    vertical-align:middle;
    animation:cursorBlink .7s infinite;
}

@keyframes cursorBlink{
    0%,45%{opacity:1}
    46%,100%{opacity:0}
}

/* =========================
   SCREEN 5 — PROFILE MENU
========================= */
.profile-screen{
    z-index:50;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .8s ease,visibility .8s ease;
}

.profile-screen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.profile-wrap{
    width:min(720px,86vw);
    text-align:center;
}

.profile-title{
    font-size:12px;
    color:#999;
    letter-spacing:4px;
    margin-bottom:22px;
}

.profile-name{
    font-size:clamp(28px,7vw,58px);
    letter-spacing:4px;
    margin-bottom:30px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    min-width:135px;
    padding:13px 18px;
    color:#ddd;
    background:rgba(25,22,31,.72);
    border:1px solid rgba(170,120,190,.4);
    cursor:pointer;
    letter-spacing:2px;
    transition:.2s ease;
}

.menu button:hover{
    background:rgba(120,55,145,.22);
    border-color:#b77acb;
    transform:translateY(-2px);
}

.info{
    margin:26px auto 0;
    min-height:75px;
    max-width:600px;
    padding:17px 20px;
    color:#aaa;
    border:1px solid rgba(130,130,140,.25);
    background:rgba(18,17,23,.58);
    line-height:1.7;
    font-size:13px;
}

/* Mobile */
@media(max-width:600px){
    .planet{width:min(280px,68vw)}
    .click-me{margin-top:225px}
    .grid{background-size:36px 36px}
    .dialogue{padding:20px 19px}
    .text{font-size:14px;letter-spacing:.7px}
    .alien{transform:scale(.8)}
    .menu button{min-width:125px}
}
</style>
</head>

<script>
/* =========================
   AUDIO — subtle space tone
========================= */
let audioStarted = false;

function startSpaceAudio(){
    if(audioStarted) return;
    audioStarted = true;

    try{
        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = 58;

        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(
            0.025,
            ctx.currentTime + .8
        );
        gain.gain.linearRampToValueAtTime(
            0,
            ctx.currentTime + 5
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 5.2);
    }catch(e){}
}

/* =========================
   SCREEN SWITCHING
========================= */
const planetScreen =
    document.getElementById("planetScreen");

const loadingScreen =
    document.getElementById("loadingScreen");

const hereScreen =
    document.getElementById("hereScreen");

const dialogueScreen =
    document.getElementById("dialogueScreen");

const profileScreen =
    document.getElementById("profileScreen");

const planet =
    document.getElementById("planet");

/* Click planet */
planet.addEventListener("click", () => {

    startSpaceAudio();

    planetScreen.classList.add("hidden");
    loadingScreen.classList.remove("hidden");

    /* Loading = 5 seconds */
    setTimeout(() => {

        loadingScreen.classList.add("hidden");
        hereScreen.classList.remove("hidden");

        /* HERE WE GO = 2 seconds */
        setTimeout(() => {

            hereScreen.classList.add("hidden");
            dialogueScreen.classList.remove("hidden");

            startDialogue();

        }, 2000);

    }, 5000);
});

/* =========================
   TYPEWRITER
========================= */
const message =
    "halo, kenalin nama w daffa putra pangestu";

const textElement =
    document.getElementById("typewriter");

let index = 0;

function startDialogue(){

    index = 0;
    textElement.textContent = "";

    setTimeout(typeWriter, 700);
}

function typeWriter(){

    if(index < message.length){

        textElement.textContent +=
            message.charAt(index);

        index++;

        const delay =
            message.charAt(index - 1) === " "
                ? 90
                : 48 + Math.random() * 45;

        setTimeout(typeWriter, delay);

    }else{

        /* Setelah tulisan selesai,
           lanjut ke profile sekitar 2.5 detik */
        setTimeout(() => {

            dialogueScreen.classList.add("hidden");

            setTimeout(() => {
                profileScreen.classList.add("show");
            }, 350);

        }, 2500);
    }
}

/* =========================
   PROFILE MENU
========================= */
function showInfo(type){

    const info =
        document.getElementById("info");

    const content = {

        about:
            "A little corner about me — Daffa Putra Pangestu. This space is where I keep my story, interests, experiences, and the things I'm still learning.",

        journey:
            "From warehouse work, sales, daily routines, and small experiments — every chapter becomes part of the journey.",

        goals:
            "Keep learning, build a stronger career, explore new places, and slowly turn the things I imagine into something real.",

        contact:
            "More contact information can be added here later — Instagram, GitHub, email, or anything else you want to share."

    };

    info.textContent = content[type] || "";
}
</script>
