<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daffa — Personal Space</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020203;
      font-family: monospace;
    }

    /* =========================
       SPACE BACKGROUND
    ========================= */

    .space {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(30, 8, 35, 0.08),
          transparent 55%
        ),
        #020203;
      overflow: hidden;
    }

    /* Small number of stars */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.65);
      opacity: 0;
      animation: twinkle 4s infinite ease-in-out;
    }

    .star:nth-child(1) { left: 12%; top: 23%; animation-delay: 0s; }
    .star:nth-child(2) { left: 81%; top: 17%; animation-delay: 1.2s; }
    .star:nth-child(3) { left: 67%; top: 73%; animation-delay: 2.5s; }
    .star:nth-child(4) { left: 24%; top: 81%; animation-delay: 3.1s; }
    .star:nth-child(5) { left: 91%; top: 61%; animation-delay: 1.8s; }
    .star:nth-child(6) { left: 43%; top: 13%; animation-delay: 2.8s; }
    .star:nth-child(7) { left: 8%; top: 67%; animation-delay: 0.7s; }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.05;
        transform: scale(0.7);
      }

      50% {
        opacity: 0.75;
        transform: scale(1.3);
      }
    }

    /* Falling stars */
    .shooting-star {
      position: absolute;
      width: 45px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.5)
      );

      transform: rotate(-35deg);
      opacity: 0;

      animation: shooting 8s infinite;
    }

    .shooting-star.one {
      top: 20%;
      left: 15%;
      animation-delay: 2s;
    }

    .shooting-star.two {
      top: 65%;
      left: 78%;
      animation-delay: 6s;
      transform: rotate(-35deg) scale(0.7);
    }

    @keyframes shooting {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(-35deg);
      }

      5% {
        opacity: 0.6;
      }

      15% {
        opacity: 0;
        transform: translate(180px, 120px) rotate(-35deg);
      }

      100% {
        opacity: 0;
      }
    }

    /* =========================
       INTRO SCREEN
    ========================= */

    .intro {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 10;
    }

    /* =========================
       PLAY BUTTON
    ========================= */

    .play-button {
      position: relative;

      width: 82px;
      height: 72px;

      border: none;

      background:
        linear-gradient(
          135deg,
          #5b164f,
          #7d1c62
        );

      cursor: pointer;

      /* pixel / imperfect shape */
      clip-path: polygon(
        8% 0%,
        92% 0%,
        100% 10%,
        100% 89%,
        92% 100%,
        8% 100%,
        0% 90%,
        0% 12%
      );

      opacity: 0.82;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease,
        filter 0.25s ease;
    }

    /* Pixel-ish broken edges */
    .play-button::before {
      content: "";

      position: absolute;
      inset: 5px;

      border: 1px solid rgba(255, 130, 220, 0.18);

      clip-path: polygon(
        5% 0%,
        94% 0%,
        100% 8%,
        100% 91%,
        94% 100%,
        6% 100%,
        0% 92%,
        0% 8%
      );
    }

    .play-button:hover {
      opacity: 1;
      transform: scale(1.05);

      filter:
        drop-shadow(0 0 8px rgba(150, 30, 120, 0.35));
    }

    .play-button:active {
      transform: scale(0.96);
    }

    /* Outline play symbol */
    .play-icon {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-42%, -50%);

      width: 0;
      height: 0;

      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;

      border-left: 18px solid transparent;
    }

    .play-icon::after {
      content: "";

      position: absolute;

      left: -18px;
      top: -12px;

      width: 18px;
      height: 24px;

      border-left: 2px solid white;
      border-top: 2px solid white;
      border-bottom: 2px solid white;

      clip-path: polygon(
        0 0,
        100% 50%,
        0 100%
      );
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    .loading {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      z-index: 20;

      background: #020203;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.5s ease;
    }

    .loading.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-text {
      margin-bottom: 12px;

      color: white;

      font-size: 11px;
      letter-spacing: 4px;

      font-weight: normal;

      animation: loadingText 1s infinite;
    }

    @keyframes loadingText {
      0%, 100% {
        opacity: 0.65;
      }

      50% {
        opacity: 1;
      }
    }

    /* Loading bar */
    .bar-container {
      width: 210px;
      height: 8px;

      border: 1px solid rgba(255,255,255,0.8);

      position: relative;

      padding: 1px;

      /* slightly pixelated */
      clip-path: polygon(
        1% 0,
        99% 0,
        100% 20%,
        100% 80%,
        99% 100%,
        1% 100%,
        0 80%,
        0 20%
      );
    }

    .bar {
      width: 0%;
      height: 100%;

      background: white;

      transition: width 0.1s linear;
    }

    .percentage {
      margin-top: 10px;

      color: rgba(255,255,255,0.55);

      font-size: 9px;

      letter-spacing: 2px;
    }

    /* =========================
       HIDE INTRO
    ========================= */

    .intro.hide {
      opacity: 0;
      pointer-events: none;

      transition: opacity 0.5s ease;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .play-button {
        width: 74px;
        height: 66px;
      }

      .bar-container {
        width: 180px;
      }

      .loading-text {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- SPACE -->
  <div class="space">

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

    <div class="shooting-star one"></div>
    <div class="shooting-star two"></div>

  </div>


  <!-- PLAY SCREEN -->

  <main class="intro" id="intro">

    <button
      class="play-button"
      id="playButton"
      aria-label="Start"
    >
      <span class="play-icon"></span>
    </button>

  </main>


  <!-- LOADING SCREEN -->

  <section class="loading" id="loading">

    <div class="loading-text">
      LOADING...
    </div>

    <div class="bar-container">
      <div class="bar" id="bar"></div>
    </div>

    <div class="percentage" id="percentage">
      0%
    </div>

  </section>


  <script>

    const playButton = document.getElementById("playButton");
    const intro = document.getElementById("intro");

    const loading = document.getElementById("loading");
    const bar = document.getElementById("bar");
    const percentage = document.getElementById("percentage");


    playButton.addEventListener("click", () => {

      /* Hide play button */
      intro.classList.add("hide");

      /* Show loading */
      loading.classList.add("active");


      /*
        5 SECOND LOADING
      */

      const duration = 5000;
      const startTime = performance.now();


      function updateLoading(currentTime) {

        const elapsed = currentTime - startTime;

        let progress = elapsed / duration;

        if (progress > 1) {
          progress = 1;
        }


        const percent = Math.floor(progress * 100);

        bar.style.width = percent + "%";

        percentage.textContent = percent + "%";


        if (progress < 1) {

          requestAnimationFrame(updateLoading);

        } else {

          /*
            Loading selesai.

            Nanti di sini kita bisa
            masuk ke website biodata kamu.
          */

          setTimeout(() => {

            console.log("WELCOME DAFFA");

            // Untuk sementara tetap di loading screen.

          }, 300);

        }

      }


      requestAnimationFrame(updateLoading);

    });

  </script>

</body>
    </html>
