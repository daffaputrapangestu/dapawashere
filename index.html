<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daffa — Personal Space</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020203;
}

/* =========================
   MAIN SPACE
========================= */

.space {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(35, 10, 45, 0.10),
            transparent 65%
        ),
        #020203;

    overflow: hidden;
}


/* =========================
   VERY FEW STARS
========================= */

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    background: white;

    opacity: 0;

    animation:
        twinkle 5s ease-in-out infinite;
}

/* positions */

.star:nth-child(1) {
    left: 14%;
    top: 24%;
    animation-delay: 1s;
}

.star:nth-child(2) {
    left: 82%;
    top: 18%;
    animation-delay: 3s;
}

.star:nth-child(3) {
    left: 73%;
    top: 72%;
    animation-delay: 0.5s;
}

.star:nth-child(4) {
    left: 22%;
    top: 78%;
    animation-delay: 2.5s;
}

.star:nth-child(5) {
    left: 91%;
    top: 52%;
    animation-delay: 4s;
}


@keyframes twinkle {

    0%,
    100% {
        opacity: 0.05;
        transform: scale(0.7);
    }

    50% {
        opacity: 0.55;
        transform: scale(1.2);
    }

}


/* =========================
   SHOOTING STARS
========================= */

.shooting-star {

    position: absolute;

    width: 45px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.7),
            transparent
        );

    opacity: 0;

    transform: rotate(-35deg);

    animation: shootingStar 11s linear infinite;
}


.shooting-star.one {

    left: 12%;
    top: 30%;

    animation-delay: 4s;

}


.shooting-star.two {

    left: 76%;
    top: 65%;

    width: 35px;

    animation-delay: 9s;

}


@keyframes shootingStar {

    0% {
        opacity: 0;

        transform:
            translate(0,0)
            rotate(-35deg);
    }

    2% {
        opacity: 0.5;
    }

    8% {

        opacity: 0;

        transform:
            translate(180px,120px)
            rotate(-35deg);
    }

    100% {
        opacity: 0;
    }

}


/* =========================
   INTRO
========================= */

.intro {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 10;

    transition:
        opacity 0.8s ease;

}


/* =========================
   PLANET
========================= */

.planet-button {

    border: none;

    background: transparent;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    align-items: center;

    outline: none;

}


.planet {

    width: 115px;

    height: auto;

    image-rendering: pixelated;

    user-select: none;

    animation:
        floating 4s ease-in-out infinite;

    transition:
        transform 0.4s ease,
        filter 0.4s ease;
}


/* planet floating */

@keyframes floating {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

    100% {
        transform: translateY(0);
    }

}


/* hover */

.planet-button:hover .planet {

    transform:
        scale(1.06)
        translateY(-3px);

    filter:
        drop-shadow(
            0 0 10px
            rgba(210,120,255,0.25)
        );

}
