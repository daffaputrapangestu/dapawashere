<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daffa — Space Profile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020205;color:white;font-family:monospace}
body{position:relative}
.space{position:absolute;inset:0;background:
radial-gradient(circle at 50% 48%,rgba(75,18,75,.12),transparent 28%),
#020205}
.star{position:absolute;width:2px;height:2px;background:#fff;opacity:.35;animation:twinkle 3s infinite ease-in-out}
.s1{left:13%;top:22%} .s2{left:78%;top:18%;animation-delay:1s}
.s3{left:22%;top:72%;animation-delay:1.8s} .s4{left:87%;top:68%;animation-delay:.6s}
.s5{left:67%;top:82%;animation-delay:2.2s}
@keyframes twinkle{50%{opacity:.08;transform:scale(.7)}}
.shooting{position:absolute;width:70px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:0;transform:rotate(-25deg);animation:shoot 8s linear infinite}
.sh1{top:20%;left:75%;animation-delay:2s} .sh2{top:67%;left:8%;animation-delay:6s}
@keyframes shoot{0%,70%{opacity:0;transform:translate(0,0) rotate(-25deg)}75%{opacity:.7}90%{opacity:0;transform:translate(-180px,80px) rotate(-25deg)}100%{opacity:0}}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
#intro{cursor:pointer}
.planet{width:min(220px,48vw);image-rendering:pixelated;animation:float 4s ease-in-out infinite;transition:.3s}
.planet:hover{filter:drop-shadow(0 0 16px rgba(180,70,255,.35));transform:scale(1.035)}
@keyframes float{50%{transform:translateY(-7px)}}
.hint{margin-top:10px;font-size:11px;letter-spacing:1px;opacity:.7}
#loading,#here,#profile{display:none}
.loading-text{font-size:11px;letter-spacing:2px;margin-bottom:12px}
.bar{width:210px;height:4px;border:1px solid #fff;padding:1px}
.fill{height:100%;width:0;background:#fff;animation:load 5s linear forwards}
@keyframes load{to{width:100%}}
.here{font-size:14px;letter-spacing:4px}
.profile{font-size:12px;letter-spacing:2px;opacity:.8}
</style>
</head>

  <div class="loading-text">LOADING</div>
  <div class="bar"><div class="fill"></div></div>
</section>

<section id="here" class="screen"><div class="here">HERE WE GO</div></section>

<section id="profile" class="screen">
  <div class="profile">PROFILE — COMING SOON</div>
</section>

<script>
function start(){
  document.getElementById('intro').style.display='none';
  document.getElementById('loading').style.display='flex';

  // Very subtle synthetic space ambience
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.025;
    const src=ctx.createBufferSource();
    const filter=ctx.createBiquadFilter();
    const gain=ctx.createGain();
    src.buffer=buffer; src.loop=true;
    filter.type='lowpass'; filter.frequency.value=280;
    gain.gain.value=0.035;
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start();
  }catch(e){}

  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('here').style.display='flex';
    setTimeout(()=>{
      document.getElementById('here').style.display='none';
      document.getElementById('profile').style.display='flex';
    },1100);
  },5000);
}
</script>
</body>
</html>
